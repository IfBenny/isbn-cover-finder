<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ISBN / ISSN / ISMN / ISRC Cover Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 20px auto;
      padding: 10px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 12px;
      padding: 14px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      border-radius: 8px;
      border: none;
      background: #0078ff;
      color: white;
    }

    #copyBtn {
      background: #00a82d;
      margin-top: 10px;
      display: none;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }

    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 8px;
    }

    .links a {
      display: block;
      margin-top: 8px;
      font-size: 18px;
    }

    #history {
      margin-top: 30px;
      padding-top: 10px;
      border-top: 1px solid #ccc;
    }

    .history-item {
      padding: 8px;
      background: #f2f2f2;
      margin-top: 6px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>ISBN / ISSN / ISMN / ISRC Cover Finder</h2>

  <input id="code" placeholder="Inserisci ISBN, ISSN, ISMN o ISRC">
  <button onclick="searchCode()">Cerca Copertina</button>
  <button id="copyBtn" onclick="copyURL()">Copia URL Copertina</button>

  <div id="result"></div>

  <div id="history">
    <h3>Cronologia ricerche</h3>
    <div id="historyList"></div>
    <button onclick="clearHistory()" style="background:#ff4444;margin-top:10px;">Cancella cronologia</button>
  </div>

  <script>
    let lastCoverURL = "";

    function saveHistory(code) {
      let history = JSON.parse(localStorage.getItem("history") || "[]");
      if (!history.includes(code)) {
        history.unshift(code);
        if (history.length > 20) history.pop();
        localStorage.setItem("history", JSON.stringify(history));
      }
      loadHistory();
    }

    function loadHistory() {
      let history = JSON.parse(localStorage.getItem("history") || "[]");
      let html = "";
